name: flutter_devtools_mcp
description: MCP server that exposes a running Dart/Flutter app's HTTP traffic (the same data as the DevTools Network tab) to AI assistants.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  dart_mcp: ^0.5.2
  dtd: ^4.0.0
  vm_service: ^15.0.0

executables:
  flutter-devtools-mcp: flutter_devtools_mcp
